services:
  bots:
    build:
      context: .
      dockerfile: Dockerfile.bots
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      REDIS_URL: ${REDIS_URL}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME}
    healthcheck:
      test: ['CMD-SHELL', 'find /tmp/bot-runner.alive -mmin -1 | grep -q .']
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    volumes:
      - app_data:/app/data

volumes:
  app_data:
    driver: local
